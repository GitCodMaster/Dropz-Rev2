plugins {
	id 'architectury-plugin' version "$architectury_plugin_version"
	id 'dev.architectury.loom' version "$loom_version" apply false
	id 'com.github.johnrengelman.shadow' version "$shadow_version"
	id 'java'
}

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'
	apply plugin: 'com.github.johnrengelman.shadow'
	apply plugin: 'maven-publish'

	version "${mod_version}+${minecraft_version}"
	group maven_group

	archivesBaseName = rootProject.archivesBaseName + '-' + name
	loom.silentMojangMappingsLicense()

	repositories {
		maven { url 'https://lazurite.dev/releases' }
		maven { url 'https://maven.modmuss50.me' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:$minecraft_version"
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    	modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_version"
    	modImplementation "dev.lazurite:rayon:$rayon_version"
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}

		withSourcesJar()
	}

	publishing {
		repositories {
			maven {
				name 'Lazurite'
				url 'https://lazurite.dev/releases'
				credentials(PasswordCredentials)
				authentication {
					register("basic", BasicAuthentication)
				}
			}
		}

		publications {
			"$name"(MavenPublication) {
				artifactId = archivesBaseName
				from components.java
			}
		}
	}
}
